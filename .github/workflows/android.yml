name: Nothing Launcher APK analysis

on:
  push:
    branches: [ main, nothing-launcher-apk-port ]
    paths:
      - 'originals/*.apk'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  decode-apks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check source APKs
        run: |
          test -f originals/nothing-launcher-1.0.2.apk
          test -f originals/nothing-launcher-1.2.4.apk

      - name: Download Apktool
        run: |
          curl -fL --retry 3 \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar \
            -o apktool.jar

      - name: Decode working and reference versions
        run: |
          java -jar apktool.jar d originals/nothing-launcher-1.0.2.apk -f -o work/launcher-1.0.2
          java -jar apktool.jar d originals/nothing-launcher-1.2.4.apk -f -o work/launcher-1.2.4

      - name: Save decoded sources for inspection
        uses: actions/upload-artifact@v4
        with:
          name: nothing-launcher-decoded-sources
          path: |
            work/launcher-1.0.2/
            work/launcher-1.2.4/
          retention-days: 14
